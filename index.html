<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://fav.farm/🧠" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroMapping: An Interactive Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 3px #22d3ee) drop-shadow(0 0 6px #06b6d4); }
        50% { filter: drop-shadow(0 0 6px #22d3ee) drop-shadow(0 0 12px #06b6d4); }
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.9; }
        70% { transform: scale(1.02); opacity: 1; }
        100% { transform: scale(0.98); opacity: 0.9; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
      .animate-path-draw {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw 2s ease-out forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes ping {
        75%, 100% { transform: scale(2); opacity: 0; }
      }
      .animate-ping-slow { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      @keyframes grow { from { width: 0%; } }
      @keyframes slide-in {
        from { transform: translateX(-100%); }
        to { transform: translateX(0); }
      }
    </style>
